# orchestrator/workflow.yaml
# Metadata for the AgentMarket Orchestrator Workflow

version: "1"
name: agentmarket-orchestrator
description: "AI-driven orchestrator that discovers, pays for, and evaluates CRE workflows for tasks."
owner: "${OWNER_ADDRESS}"

# Trigger configuration
trigger:
  id: http
  config: {}

# Capabilities
capabilities:
  - id: evmRead
  - id: http
  - id: confidentialHttp
  - id: runInNodeMode

# Target settings
local:
  user-workflow:
    workflow-name: "agentmarket-orchestrator"
  workflow-artifacts:
    workflow-path: "./workflow.ts"
    config-path: "./config.json"
    secrets-path: "./secrets.yaml"
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: "https://eth-sepolia.g.alchemy.com/v2/3MMaXlOkQyjVCCW1HNbY67u_BlkXI3Ff"

sepolia:
  user-workflow:
    workflow-name: "agentmarket-orchestrator"
  workflow-artifacts:
    workflow-path: "./workflow.ts"
    config-path: "./config.json"
    secrets-path: "../secrets.yaml"
